name: Build macOS client

# electron-builder cannot produce a .dmg from Windows or Linux - the app bundle
# and its signing step need macOS tooling. This runs the same build on a hosted
# Mac and uploads the installer as an artifact.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        default: x64
        type: choice
        options: [x64, arm64]

jobs:
  build:
    # Host architecture does not have to match the target: electron-builder
    # downloads the darwin-x64 Electron for an --x64 build, and the Pepper Flash
    # plugin is a bundled file rather than something compiled here. macos-13
    # (the old Intel image) has been retired and queues forever.
    #
    # The *target* must stay x64: the bundled Flash plugin is x64-only, so an
    # x64 app runs on Apple Silicon under Rosetta with working Flash, where a
    # native arm64 build would launch and render nothing.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write build config
        # .env.production is gitignored (it carries WS_SECRET), so CI recreates
        # it. WS_SECRET must match the Red5 server's or the space handshake
        # fails to decrypt and the client hangs on the loading bar.
        run: |
          cat > .env.production <<EOF
          NODE_ENV=production
          VITE_DEFAULT_URL=https://playsmallworlds.com
          VITE_API_URL=https://playsmallworlds.com
          VITE_USER_AGENT="SmallWorldsClient"
          VITE_WS_SECRET="${{ secrets.WS_SECRET }}"
          VITE_WS_URL="wss://playsmallworlds.com/ws/default"
          EOF
          test -s .env.production

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build renderer
        run: npm run build

      - name: Build macOS installer
        # No Apple Developer certificate, so this cannot be notarised. It is
        # still ad-hoc signed below: macOS 13+ kills an Electron app whose
        # bundle has no signature at all, which looks to the user like the app
        # simply doing nothing when launched.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --${{ inputs.arch }} --publish never --dir

      - name: Ad-hoc sign the app bundle
        # The Flash plugin is placed in Contents/plugins (see extraResources in
        # package.json) because flash.js resolves it as resourcesPath/../plugins
        # on every platform. That is a non-standard spot inside a .app, so the
        # bundle has to be re-signed after it is dropped in or the resource
        # envelope does not match. Sign inside-out: nested code first, then the
        # outer bundle.
        run: |
          APP=$(find dist -maxdepth 2 -name "*.app" -print -quit)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          echo "signing $APP"
          find "$APP/Contents/Frameworks" -name "*.framework" -maxdepth 1 -print0 2>/dev/null             | xargs -0 -I{} codesign --force --sign - --timestamp=none {} || true
          find "$APP/Contents/Frameworks" -name "*.app" -maxdepth 1 -print0 2>/dev/null             | xargs -0 -I{} codesign --force --deep --sign - --timestamp=none {} || true
          codesign --force --deep --sign - --timestamp=none "$APP"
          echo "--- verification ---"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -8
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | head -8

      - name: Package the signed app into a DMG
        run: npx electron-builder --mac --${{ inputs.arch }} --publish never --prepackaged "$(find dist -maxdepth 2 -name '*.app' -print -quit)"

      - name: Show what was produced
        run: ls -lh dist/*.dmg dist/*.zip 2>/dev/null || ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: smallworlds-mac-${{ inputs.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: error

      - name: Notes
        run: |
          echo "### macOS build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The app is **ad-hoc signed, not notarised**. On first launch macOS" >> $GITHUB_STEP_SUMMARY
          echo "still warns; tell testers to right-click the app and choose **Open**," >> $GITHUB_STEP_SUMMARY
          echo "or approve it under System Settings -> Privacy & Security." >> $GITHUB_STEP_SUMMARY
          echo "Drag it to /Applications first - launching from the mounted DMG fails." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Signing needs an Apple Developer account (99 USD/yr); notarising" >> $GITHUB_STEP_SUMMARY
          echo "additionally requires an app-specific password." >> $GITHUB_STEP_SUMMARY
